name: Release WASM OCI Artifact

on:
  workflow_call:
    inputs:
      artifact-tag:
        description: 'Release tag (e.g. v0.1.0 or git sha)'
        required: true
        type: string
      image-name:
        description: 'Image name'
        required: false
        default: 'tracker-wasm'
        type: string
    secrets:
      REGISTRY_TOKEN:
        required: false

jobs:
  publish-oci:
    name: Package & Push OCI Artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compiled WASM
        uses: actions/download-artifact@v4
        with:
          name: wasm-release-binary
          path: ./artifacts

      - name: Setup ORAS (OCI Registry As Storage)
        uses: oras-project/setup-oras@v1

      - name: Log in to GHCR
        run: |
          TOKEN="${{ secrets.REGISTRY_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi
          echo "$TOKEN" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push WASM as OCI Artifact
        run: |
          WASM_PATH=$(find ./artifacts -name "*.wasm" | head -n 1)
          IMAGE_REF="ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:${{ inputs.artifact-tag }}"
          LATEST_REF="ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:latest"

          echo "Publishing $WASM_PATH to $IMAGE_REF..."
          oras push "$IMAGE_REF" \
            --artifact-type application/vnd.module.wasm.content.layer.v1+wasm \
            "$WASM_PATH":application/vnd.module.wasm.content.layer.v1+wasm

          echo "Publishing $WASM_PATH to $LATEST_REF..."
          oras push "$LATEST_REF" \
            --artifact-type application/vnd.module.wasm.content.layer.v1+wasm \
            "$WASM_PATH":application/vnd.module.wasm.content.layer.v1+wasm
